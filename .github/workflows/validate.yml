name: Validate Index

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: brick-pm/brick
          ref: main
          path: .brick-cli
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo run --manifest-path .brick-cli/Cargo.toml -- index validate .
